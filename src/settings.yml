---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.1.1
serverless_language: node
polling_url: https://raw.githubusercontent.com/michaelkurath/TRMNL-IsHeDeadYet/main/data/wikidata.json
polling_headers: Accept=application/json
polling_body: ''
id: 316259
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: Checks public Wikidata death-status records for selected public figures, with dark humor. Source code and documentation are available on <a href="https://github.com/michaelkurath/TRMNL-IsHeDeadYet" target="_blank" rel="noopener">GitHub</a>.
  email_address: michael.kurath@gmail.com
  learn_more_url: https://github.com/michaelkurath/TRMNL-IsHeDeadYet
  category: news,morbid
- keyname: person
  field_type: select
  name: Person
  description: Choose whose public death-status signals to check
  default: Donald Trump
  options:
  - Donald Trump
  - Joe Biden
  - Barack Obama
  - Vladimir Putin
  - Xi Jinping
  - Kim Jong Un
  - Elon Musk
  - Rupert Murdoch
  - Mitch McConnell
- keyname: tone
  field_type: select
  name: Tone
  description: Choose how dark the mortality desk should sound
  default: grim
  options:
  - 'Dry: dry'
  - 'Grim: grim'
  - 'Pitch Black: pitch_black'
name: Is he dead yet?
description: Public figure status checker
refresh_interval: 60
